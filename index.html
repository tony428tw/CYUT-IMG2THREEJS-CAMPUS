<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f0e5"><title>鐘樓光景 · Three.js 校園微縮模型</title></head>
<body><div id="scene"></div><header><p class="eyebrow">PROCEDURAL CAMPUS · 01</p><h1>鐘樓光景<span>朝陽科技大學</span></h1><p class="intro">把校園的一隅，放在掌心。</p></header>
<aside id="inspector"><span class="kicker">MODEL EXPLORER</span><h2 id="part-name">校園微縮景觀</h2><p id="part-note">拖曳旋轉 · 滾輪縮放<br>點選建築，探索每個組件。</p><div class="rule"></div><label>觀看角度<select id="view"><option value="match">參考視角</option><option value="front">正面</option><option value="right">右側</option><option value="rear">背面（推估）</option><option value="left">左側</option><option value="top">俯視</option></select></label><label>光線<select id="lighting"><option value="reference">暖日光</option><option value="neutral">中性光</option><option value="grazing">側光細節</option></select></label><label class="slider-label">展開組件 <output id="explode-value">0%</output><input id="explode" aria-label="展開組件" type="range" min="0" max="100" value="0"></label><div class="buttons"><button id="reset">重設視角</button><button id="spin" aria-pressed="false">自動旋轉</button></div><button id="download" class="download">下載模型 GLB ↗</button><p class="fine">依單張圖像進行程序化重建。<br>背面、植栽及微小裝飾為近似。</p></aside>
<footer><span class="status-dot"></span><span id="status">正在建構模型…</span><span class="footer-right">THREE.JS · CODE ONLY</span></footer>
<script type="module" src="/src/main.ts"></script></body></html>
